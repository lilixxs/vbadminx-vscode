name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 编译（tsc + esbuild bundle）
        run: npm run compile
      - name: 单元测试
        run: npm test
      - name: VBA 语法/语义用例回归
        run: npm run cases:vba
      - name: 语言服务器性能基准
        run: npm run benchmark:lsp
      - name: 打包 VSIX
        run: npm run package
      - name: 上传 VSIX 产物
        uses: actions/upload-artifact@v4
        with:
          name: vbadminx-vscode-${{ github.sha }}
          path: output/*.vsix
          if-no-files-found: error
      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            output/*.json
            output/*.md
          if-no-files-found: ignore

  host:
    name: VS Code 宿主集成检查
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: 安装虚拟显示
        # 只装 xvfb：GitHub ubuntu-latest 镜像已预装 GTK/NSS/GBM 等运行库。
        # 不要写死 libgtk-3-0 / libasound2：Ubuntu 24.04 已改名为 *t64，原包名会导致 apt 失败。
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: 缓存 VS Code 测试实例
        uses: actions/cache@v4
        with:
          path: ~/.vscode-test
          key: vscode-test-${{ runner.os }}-1.104.3
          restore-keys: vscode-test-${{ runner.os }}-
      - name: 运行宿主检查（31 项 LSP/AI 验证）
        # 集成检查依赖图形环境，失败不阻断 CI（job 级 continue-on-error 仍是兜底）。
        continue-on-error: true
        run: xvfb-run -a npm run test:host
