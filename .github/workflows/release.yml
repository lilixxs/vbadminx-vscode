name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing（OIDC）需要；未使用时无害。
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与 tag 来生成“更新内容”。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: 单元测试
        run: npm test
      - name: 打包 VSIX
        run: npm run package
      - name: 生成发布说明
        id: notes
        shell: bash
        run: |
          git fetch --tags --force --quiet
          version=$(node -p "require('./package.json').version")
          name=$(node -p "const p=require('./package.json'); p.name + '-' + p.version + '.vsix'")
          file="output/$name"
          sha=$(sha256sum "$file" | awk '{print $1}')
          current="${GITHUB_REF_NAME:-}"
          case "$current" in v*) ;; *) current="v$version" ;; esac
          previous=$(git tag --sort=-version:refname | grep -vx "$current" | head -n1 || true)
          if [ -n "$previous" ]; then
            commits=$(git log "$previous..HEAD" --no-merges --pretty=format:'- %s' 2>/dev/null || true)
          else
            commits=$(git log --no-merges -n 20 --pretty=format:'- %s' 2>/dev/null || true)
          fi
          {
            printf '## 更新内容\n\n'
            if [ -n "$commits" ]; then printf '%s\n' "$commits"; else printf -- '- 本次发布包含维护性更新。\n'; fi
            printf '\n## SHA-256\n\n'
            printf '`%s  %s`\n' "$sha" "$name"
            printf '\n## VSIX 安装方法\n\n'
            printf '1. 下载本 Release 附件中的 `%s`。\n' "$name"
            printf '2. 打开 VS Code，进入扩展视图，点击右上角 `...` → **从 VSIX 安装...**，选择该文件。\n'
            printf '3. 或在终端执行：`code --install-extension %s`\n' "$name"
            printf '4. 安装完成后按提示重新加载窗口。\n'
            printf '\n## VS Code Marketplace\n\n'
            printf 'https://marketplace.visualstudio.com/items?itemName=lilixxs.vbadminx-vscode\n'
          } > release-notes.md
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "vsix=$name" >> "$GITHUB_OUTPUT"
          echo '----- release-notes.md -----'
          cat release-notes.md
      - name: 发布到 VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSCE="./node_modules/.bin/vsce"
          echo "vsce 版本: $($VSCE --version)"
          echo "publisher: $(node -p "require('./package.json').publisher")"
          echo "版本: $(node -p "require('./package.json').version")"
          echo "OIDC 端点可用: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          if [ -n "$VSCE_PAT" ]; then
            echo "使用 VSCE_PAT（PAT 将于 2026-12-01 退役，建议改用 Trusted Publishing）"
            "$VSCE" publish --pat "$VSCE_PAT"
          else
            echo "未配置 VSCE_PAT，使用 Trusted Publishing（OIDC）"
            "$VSCE" publish --oidc
          fi
      - name: 发布到 Open VSX Registry
        if: ${{ !cancelled() }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::未配置 OVSX_PAT，跳过 Open VSX 发布"
          else
            npx --yes ovsx publish --pat "$OVSX_PAT" output/*.vsix
          fi
      - name: 创建 GitHub Release 并附加 VSIX
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.vsix
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
