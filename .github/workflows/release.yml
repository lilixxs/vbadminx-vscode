name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing（OIDC）需要；未使用时无害。
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: 单元测试
        run: npm test
      - name: 打包 VSIX
        run: npm run package
      - name: 发布到 VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          echo "vsce 版本: $(npx --yes @vscode/vsce --version)"
          echo "publisher: $(node -p "require('./package.json').publisher")"
          echo "版本: $(node -p "require('./package.json').version")"
          echo "OIDC 端点可用: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          if [ -n "$VSCE_PAT" ]; then
            echo "使用 VSCE_PAT（PAT 将于 2026-12-01 退役，建议改用 Trusted Publishing）"
            npx --yes @vscode/vsce publish --pat "$VSCE_PAT"
          else
            echo "未配置 VSCE_PAT，使用 Trusted Publishing（OIDC）"
            npx --yes @vscode/vsce publish --oidc
          fi
      - name: 发布到 Open VSX Registry
        if: ${{ !cancelled() }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::未配置 OVSX_PAT，跳过 Open VSX 发布"
          else
            npx --yes ovsx publish --pat "$OVSX_PAT" output/*.vsix
          fi
      - name: 创建 GitHub Release 并附加 VSIX
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
